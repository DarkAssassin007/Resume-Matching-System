<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Resume Matching System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #2c3e50 0%, #1a2a3a 100%);
        }
        
        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
        }
        
        .card {
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: none;
            overflow: hidden;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card-header {
            background: var(--secondary-gradient);
            border: none;
            padding: 30px;
            text-align: center;
        }
        
        .card-header h3 {
            color: white;
            font-weight: 700;
            margin: 0;
            font-size: 1.8rem;
        }
        
        .card-header i {
            margin-right: 10px;
            font-size: 1.5rem;
        }
        
        .card-body {
            padding: 30px;
        }
        
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
        
        .input-group {
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .input-group-text {
            background: #f8f9fa;
            border: none;
            color: #667eea;
            font-size: 1.1rem;
            width: 45px;
            text-align: center;
        }
        
        .form-control {
            border: none;
            padding: 15px;
            font-size: 1rem;
            height: 50px;
        }
        
        .form-control:focus {
            box-shadow: none;
            outline: none;
        }
        
        .btn-login {
            background: var(--primary-gradient);
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login i {
            margin-right: 8px;
        }
        
        .alert {
            border-radius: 8px;
            font-weight: 500;
        }
        
        .card-footer {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 20px;
            text-align: center;
        }
        
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .brand h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .brand p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            margin: 10px 0 0 0;
        }
        
        .brand i {
            color: #667eea;
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand mb-4 text-center">
            <h1><i class="fas fa-user-tie"></i> Resume Matching System</h1>
            <p>AI-Powered Recruitment Automation</p>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-lock"></i> Secure Login</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="/login">
                    <div class="mb-4">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-login">
                            <i class="fas fa-sign-in-alt"></i> Sign In
                        </button>
                    </div>
                    
                    {% if error %}
                    <div class="alert alert-danger mt-4 mb-0">
                        <i class="fas fa-exclamation-circle"></i> {{ error }}
                    </div>
                    {% endif %}
                </form>
            </div>
            <div class="card-footer text-muted">
                <small>© 2024 Resume Matching System. All rights reserved.</small>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
